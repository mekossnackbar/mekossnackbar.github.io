<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mekos Snackbar Receipt</title>
<style>
:root{--bg:#fcbf00;--ink:#2b1a05;--mute:#7a6540;--red:#c92a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:420px;margin:0 auto}
.logo{display:block;width:210px;max-width:60%;margin:4px auto 6px;filter:drop-shadow(0 4px 6px rgba(90,40,0,.35))}
h1{text-align:center;margin:0 0 12px;font-size:26px}
.paper{background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 6px 18px rgba(90,40,0,.25)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin:3px 0}.meta span:first-child{color:var(--mute)}
hr{border:0;border-top:2px dashed #e5d28a;margin:14px 0}
.it{display:flex;justify-content:space-between;gap:12px;margin:9px 0;font-weight:700}
.it small{display:block;color:var(--mute);font-weight:600}
.row{display:flex;justify-content:space-between;margin:5px 0}
.big{font-size:26px;font-weight:900;color:var(--red);margin-top:10px}
.ty{text-align:center;font-weight:800;margin:14px 0 4px}
.sm{text-align:center;font-size:13px;color:var(--mute);line-height:1.5}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:10px;font:inherit;font-weight:900;font-size:17px}
.b1{background:var(--ink);color:#ffd43b}.b2{background:#fff;color:var(--ink)}
.err{background:#fff;border-radius:18px;padding:22px;text-align:center}
@media print{body{background:#fff}.btn,.logo{display:none}.paper{box-shadow:none}}
</style>
</head>

<script>
(function(){
var out=document.getElementById('out');
function un(s){return decodeURIComponent(String(s).replace(/_/g,' '))}
function nm(s){return Number(String(s).replace(',','.'))||0}
function peso(n){return '\u20B1'+(Math.round(n*100)/100).toLocaleString('en-PH')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
try{
 var p=location.hash.slice(1).split('~');
 if(p.length<9)throw 0;
 var id=un(p[0]),date=un(p[1]),time=un(p[2]),type=un(p[3]),pay=un(p[4]),fee=nm(p[5]),cash=nm(p[6]),cust=un(p[7]);
 var items=p[8].split('*').map(function(x){var a=x.split('.');return{n:un(a[0]),s:un(a[1]||''),f:un(a[2]||''),p:nm(a[3]),q:nm(a[4])||1}});
 var sub=items.reduce(function(a,i){return a+i.p*i.q},0),total=sub+fee,chg=pay==='Cash'&&cash>=total?cash-total:0;
 var h='<h1>Thank you!</h1><div class="paper">'+
 '<div class="meta"><span>Receipt no.</span><b>'+esc(id)+'</b></div>'+
 '<div class="meta"><span>Date</span><span>'+esc(date)+' '+esc(time)+'</span></div>'+
 '<div class="meta"><span>Order type</span><span>'+esc(type)+'</span></div>'+
 '<div class="meta"><span>Payment</span><span>'+esc(pay)+'</span></div>'+
 (cust?'<div class="meta"><span>Customer</span><span>'+esc(cust)+'</span></div>':'')+'<hr>';
 items.forEach(function(i){h+='<div class="it"><div>'+i.q+'x '+esc(i.n)+'<small>'+esc([i.s,i.f].filter(Boolean).join(' - '))+(i.q>1?' @ '+peso(i.p):'')+'</small></div><div>'+peso(i.p*i.q)+'</div></div>'});
 h+='<hr><div class="row"><span>Subtotal</span><span>'+peso(sub)+'</span></div>';
 if(fee)h+='<div class="row"><span>Delivery fee</span><span>'+peso(fee)+'</span></div>';
 h+='<div class="row big"><span>TOTAL</span><span>'+peso(total)+'</span></div>';
 if(pay==='Cash'&&cash>0){h+='<div class="row"><span>Cash</span><span>'+peso(cash)+'</span></div><div class="row"><span>Change</span><span>'+peso(chg)+'</span></div>'}
 h+='<hr><div class="ty">Salamat po! Thank you for ordering \uD83C\uDF54\uD83E\uDD64</div>'+
 '<div class="sm">Mekos Snackbar &bull; Quezon City<br>Open 10am to 2am daily<br>Call / Text: 0915 346 6183<br>This is not an official receipt.</div></div>'+
