<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mekos Snackbar Receipt</title>
<style>
:root{--bg:#fcbf00;--ink:#2b1a05;--mute:#7a6540;--red:#c92a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:420px;margin:0 auto}
.logo{display:block;width:210px;max-width:60%;margin:4px auto 6px;filter:drop-shadow(0 4px 6px rgba(90,40,0,.35))}
h1{text-align:center;margin:0 0 12px;font-size:26px}
.paper{background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 6px 18px rgba(90,40,0,.25)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin:3px 0}.meta span:first-child{color:var(--mute)}
hr{border:0;border-top:2px dashed #e5d28a;margin:14px 0}
.it{display:flex;justify-content:space-between;gap:12px;margin:9px 0;font-weight:700}
.it small{display:block;color:var(--mute);font-weight:600}
.row{display:flex;justify-content:space-between;margin:5px 0}
.big{font-size:26px;font-weight:900;color:var(--red);margin-top:10px}
.ty{text-align:center;font-weight:800;margin:14px 0 4px}
.sm{text-align:center;font-size:13px;color:var(--mute);line-height:1.5}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:10px;font:inherit;font-weight:900;font-size:17px}
.b1{background:var(--ink);color:#ffd43b}.b2{background:#fff;color:var(--ink)}
.err{background:#fff;border-radius:18px;padding:22px;text-align:center}
.pay{margin:14px 0 4px;border:3px solid #c92a2a;border-radius:16px;padding:12px;text-align:center;background:#fff8e1}
.pay .pt{font-size:22px;font-weight:900;color:#c92a2a}.pay img{width:230px;max-width:80%;display:block;margin:8px auto;border-radius:8px;background:#fff}
.pay .pn{font-weight:800;line-height:1.35}.pay .sm{margin-top:8px}
.stamp{margin:12px 0 2px;text-align:center;font-weight:900;color:#2f9e44;border:3px solid #2f9e44;border-radius:12px;padding:8px;letter-spacing:1px}
@media print{body{background:#fff}.btn,.logo{display:none}.paper{box-shadow:none}}
</style>
</head>
